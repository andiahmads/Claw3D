# Claw3D Studio + bundled demo gateway.
# The demo gateway shares the studio's network namespace so Studio can reach it
# at ws://localhost:18789 without exposing the gateway port.
services:
  studio:
    build:
      context: .
      args:
        CLAW3D_ALLOW_HTTP: ${CLAW3D_ALLOW_HTTP:-true}
    image: claw3d:local
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      STUDIO_ACCESS_TOKEN: ${STUDIO_ACCESS_TOKEN:?set STUDIO_ACCESS_TOKEN in .env}
      CLAW3D_GATEWAY_URL: ${CLAW3D_GATEWAY_URL:-ws://localhost:18789}
      CLAW3D_GATEWAY_TOKEN: ${CLAW3D_GATEWAY_TOKEN:-}
      CLAW3D_GATEWAY_ADAPTER_TYPE: ${CLAW3D_GATEWAY_ADAPTER_TYPE:-demo}
      # Served over plain HTTP: skip the CSP HTTPS upgrade and HSTS.
      CLAW3D_ALLOW_HTTP: ${CLAW3D_ALLOW_HTTP:-true}
      # Required in production: hostnames Studio may proxy to (comma-separated).
      UPSTREAM_ALLOWLIST: ${UPSTREAM_ALLOWLIST:-localhost,127.0.0.1}
    ports:
      - "${CLAW3D_BIND:-127.0.0.1}:${CLAW3D_PORT:-3000}:3000"
    volumes:
      - studio-state:/root/.openclaw

  # Gateway adapter: demo-gateway-adapter.js (mock agents) or
  # hermes-gateway-adapter.js (any OpenAI-compatible API, e.g. DeepSeek).
  gateway:
    image: claw3d:local
    restart: unless-stopped
    command: ["node", "server/${CLAW3D_GATEWAY_SCRIPT:-demo-gateway-adapter.js}"]
    network_mode: "service:studio"
    environment:
      HERMES_API_URL: ${HERMES_API_URL:-http://localhost:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-hermes}
      HERMES_AGENT_NAME: ${HERMES_AGENT_NAME:-Hermes}
      # Remote browser for agents (unset to disable the browser_* tools).
      BROWSER_WS_URL: ${BROWSER_WS_URL:-ws://browser:3000/}
    # Logins agents may use as {{secret:NAME}}: BROWSER_SECRET_NAME=value lines.
    env_file:
      - path: browser-secrets.env
        required: false
    volumes:
      - gateway-state:/root/.hermes
    depends_on:
      - studio
      - browser

  # Shared headless Chromium, reachable only inside the compose network.
  browser:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    restart: unless-stopped
    init: true
    shm_size: 1gb
    user: pwuser
    working_dir: /home/pwuser
    command: ["npx", "-y", "playwright@1.58.0", "run-server", "--port", "3000", "--host", "0.0.0.0"]

volumes:
  studio-state:
  gateway-state:
